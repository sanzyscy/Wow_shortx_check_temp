name: Shortx Own Browser Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shortx-own-manual
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout this repository only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test original parser without network
        run: python3 -m unittest discover -s tests -v

      - name: Install Microsoft Playwright in isolated environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.64.1'

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Investigate one link with bounded clicks and time
        run: |
          .venv/bin/python shortx_resolver.py \
            --url 'https://shortxlinks.in/8ciL1' \
            --seconds 225 \
            --max-clicks 10 \
            --out result

      - name: Preserve report for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shortx-own-report
          path: result/
          if-no-files-found: warn
          retention-days: 1
